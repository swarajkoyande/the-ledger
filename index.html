    <script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {
      "@type": "Question",
      "name": "Is The Ledger free to join?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. The Ledger is completely free for students. There are no subscription fees, no hidden costs, and no paywall on any core features."
      }
    },
    {
      "@type": "Question",
      "name": "Do I need to be in a school club to join?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "No. Any high school student can create a free account on the Ledger App regardless of whether their school has a chapter. Club membership is separate from app access."
      }
    },
    {
      "@type": "Question",
      "name": "What ages can join The Ledger?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "The Ledger is designed for high school students, typically ages 14 to 18. University students with a strong interest in economics and finance are also welcome."
      }
    },
    {
      "@type": "Question",
      "name": "What do I do on day one after signing up?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "After creating your free account you can join your city chapter, explore the learning modules, enter the trading competition leaderboard, and connect with students from Tokyo, Singapore, Mumbai, Delhi, Gold Coast, and Madrid."
      }
    },
    {
      "@type": "Question",
      "name": "Is my data sold or shared with third parties?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "No. The Ledger does not sell, share, or monetise user data. Your information is used only to operate the platform and will never be passed to advertisers or third parties."
      }
    },
    {
      "@type": "Question",
      "name": "Can I start a Ledger chapter at my school?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. Use the Register Your Club form on the website to apply. The Ledger team will respond within 48 hours with onboarding support, resources, and access to the regional chapter network."
      }
    }
  ]
}
</script>
  </head>
  <body>
    <div id="root"></div>

    <!-- Netlify Forms: static declarations so Netlify detects them at build time -->
    <form name="register-club" netlify netlify-honeypot="bot-field" hidden>
      <input name="bot-field" />
      <input name="clubName" /><input name="schoolName" />
      <input name="contactName" /><input name="email" />
      <input name="country" /><input name="members" />
      <textarea name="about"></textarea>
    </form>
    <form name="regional-head" netlify netlify-honeypot="bot-field" hidden>
      <input name="bot-field" />
      <input name="fullName" /><input name="email" />
      <input name="region" /><input name="school" />
      <textarea name="background"></textarea><textarea name="motivation"></textarea>
    </form>
    <form name="newsletter" netlify netlify-honeypot="bot-field" hidden>
      <input name="bot-field" /><input name="email" />
    </form>
  </body>
