<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="The Ledger — An international, student-led finance network connecting ambitious minds, leading experts, and global institutions." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,300&family=Josefin+Sans:wght@300;400;600;700&display=swap" rel="stylesheet" />
    <title>The Ledger</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Netlify Forms: static declarations so Netlify detects them at build time -->
    <form name="register-club" netlify netlify-honeypot="bot-field" hidden>
      <input name="bot-field" />
      <input name="clubName" /><input name="schoolName" />
      <input name="contactName" /><input name="email" />
      <input name="country" /><input name="members" />
      <textarea name="about"></textarea>
    </form>
    <form name="regional-head" netlify netlify-honeypot="bot-field" hidden>
      <input name="bot-field" />
      <input name="fullName" /><input name="email" />
      <input name="region" /><input name="school" />
      <textarea name="background"></textarea><textarea name="motivation"></textarea>
    </form>
    <form name="newsletter" netlify netlify-honeypot="bot-field" hidden>
      <input name="bot-field" /><input name="email" />
    </form>
  </body>
</html>
