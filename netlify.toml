[build]
  command = "npm run build"
  publish = "dist"

# ── Canonical redirects ─────────────────────────────────────────────────────

# HTTP → HTTPS
[[redirects]]
  from = "http://theledger.online/*"
  to = "https://theledger.online/:splat"
  status = 301
  force = true

# www → non-www
[[redirects]]
  from = "https://www.theledger.online/*"
  to = "https://theledger.online/:splat"
  status = 301
  force = true

# /home → /  (de-duplicate the homepage)
[[redirects]]
  from = "/home"
  to = "https://theledger.online/"
  status = 301
  force = true

[[redirects]]
  from = "/home/"
  to = "https://theledger.online/"
  status = 301
  force = true

# ── SPA catch-all (must be last) ────────────────────────────────────────────
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ── Security headers ────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-XSS-Protection = "1; mode=block"

# ── Cache headers for static assets ────────────────────────────────────────
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
